<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulário</title>
</head>
<body>
    
<div class="cabecalho">
   <h1>Formulário</h1>
   <h2>Preencha os campos abaixo</h2>
</div>


<div class="formulario">


<form action="" method="POST">   <!-- POST / GET -->

<div class="campo">
    <label for="nome">Nome Completo:</label>
    <input type="text" id="nome" name="nome_completo" placeholder="Digite seu nome completo do usuário" size="40" required>
</div>

<div class="campo">
    <label for="cidade">Cidade:</label>
    <input type="text" id="cidade" name="cidade" placeholder="Digite a cidade onde reside o usuário" size="40" required>
</div>

<div class="campo">
    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" placeholder="Digite o e-mail do usuário" size="40" required>
</div>

<div class="campo">
    <label for="senha">Senha de Acesso:</label>
    <input type="password" id="senha" name="senha" placeholder="Digite a senha de acesso" size="10" required>
</div>

<div class="campo">
    <label for="data">Data de Nascimento:</label>
    <input type="date" id="data" name="data_nascimento" placeholder="Digite a data de nascimento do usuário" size="40" required>
</div>

<div class="campo">
    <label for="telefone">Telefone:</label>
    <input type="tel" id="telefone" name="telefone" placeholder="(##) #####-####" size="10" required>
</div>

<div class="campo">
    <label for="estado">Estado:</label>
    <select id="estado" name="estado" required> 
    <option>Rio de Janeiro</option>
    <option>São Paulo</option>
    <option>Minas Gerais</option>
    <option>Ceará</option>
    <option>Piauí KKKKKKKKKKKKKK</option>
    </select>

    </div>

<div class="campo">
    <label class="titulo-campo">Turno de Preferência:</label>
    <label class="opcao" > 
        <input type="radio" name="turno" value="manha" >Manhã</input>
    </label>
<label class="opcao">
        <input type="radio" name="turno" value="tarde">Tarde</input>
    </label>
    <label class="opcao">
        <input type="radio" name="turno" value="noite">Noite</input>
    </label>
    
</div>

<div class="campo">
    <label class="titulo-campo">Área de Interesse:</label>
    <label class="opcao">
        <input type="checkbox" name="interesse" value="tecnologia">Tecnologia</input>
    </label>
<label class="opcao">
        <input type="checkbox" name="interesse" value="design">Design</input>
    </label>
    <label class="opcao">
        <input type="checkbox" name="interesse" value="marketing">Marketing</input>
    </label>
    
</div>

<div class="campo">
    <label for="mensagem">Mensagem:</label>
    <textarea id="obs" name="obs" rows="4" placeholder="Escreva aqui seu Comentario">

    </textarea>
</div>

<div class="imagem">
<label for="foto">Escolha uma Imagem:</label>
<input type="file" id="imagem" name="imagem" accept="image/png,mage/jpeg">



<div class="campo">
    <button class="button" type="submit">Enviar</button>
</div>


    
</div>
</form>
</div>

</body>
</html>
